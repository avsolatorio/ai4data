name: Small AI harness

# Runs the lint and the tests of ai4data.small_ai that need neither a GPU
# nor a model server, whenever the package or its tests change.

on:
  push:
    branches: [main]
    paths:
      - "src/ai4data/small_ai/**"
      - "tests/test_small_ai_harness.py"
      - ".github/workflows/small-ai-harness.yml"
  pull_request:
    paths:
      - "src/ai4data/small_ai/**"
      - "tests/test_small_ai_harness.py"
      - ".github/workflows/small-ai-harness.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest ruff pandas scikit-learn pydantic truststore
      - name: Lint
        run: ruff check src/ai4data/small_ai tests/test_small_ai_harness.py
      - name: Test
        run: PYTHONPATH=src pytest tests/test_small_ai_harness.py -p no:cacheprovider --noconftest -q
