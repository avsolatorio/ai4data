[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relevance-explainer"
version = "0.2.0"
description = "Small model that explains whether a catalog record answers a search, with references checked against the record"
readme = "README.md"
requires-python = ">=3.10"
# Inference only (relevance_explainer.inference): the INT8 model file, the verifier, calibration and the faithfulness
# score. Exact versions of the research environment are in requirements/relexp-lock.txt.
dependencies = [
    "torch>=2.5",
    "tokenizers>=0.20",
    "numpy>=1.26",
]

[project.optional-dependencies]
# web app (relevance_explainer.webapp); edited searches in the app also need sentence-transformers
app = ["starlette>=0.40", "uvicorn>=0.30", "sentence-transformers>=3.0", "fasttext-wheel>=0.9.2"]
# synthetic data generation and labelling (relevance_explainer.synth, .distill); the teacher is served separately
# with vLLM (requirements/vllm-lock.txt)
synth = ["babel>=2.15", "fasttext-wheel>=0.9.2", "sentence-transformers>=3.0", "scikit-learn>=1.5"]
# pretraining, fine-tuning, DPO, the faithfulness scorer fit (relevance_explainer.tiny, .train)
train = ["transformers>=4.45", "datasets>=3.0", "huggingface_hub>=0.25", "safetensors>=0.4", "scikit-learn>=1.5"]
notebook = ["ipython>=8", "ipywidgets>=8"]
dev = ["pytest>=7"]

[project.scripts]
relevance-explainer = "relevance_explainer.inference:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
relevance_explainer = ["webapp/static/*", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
