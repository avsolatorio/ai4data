<!doctype html>

<link rel="stylesheet" href="../stages/kit/stage.css">
<style>
  /* YouTube thumbnail, 1280x720: a small model learning from a large guide. */

  .big { position: absolute; left: 730px; top: 150px; width: 300px; height: 300px; border-radius: 26px; background: #2a3039; border: 2px solid #3a424d;

    <path d="M1118 395 L1130 412 L1142 395" fill="none" stroke="#7ba7f2" stroke-width="5"/></svg>
  <div class="big"><b>Guide</b><span style="font-size:22px">large model</span></div>

  <div class="small-l">Small model</div>
