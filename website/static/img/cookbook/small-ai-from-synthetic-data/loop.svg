<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" style="max-width:100%;height:auto" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Feedback loop with a control arm</title><desc id="d">Animation of the feedback loop. The targeted arm is a cycle: a gap report on the feedback set, a plan by an agent with seven tools of the harness and no shell or files (in the first topic round, 65 of 150 requests on weak labels and 85 on five confused pairs), generation by a writer and a labeller that drops texts on which the two disagree (2.8 percent of ISCO titles and 4.5 percent of COICOP descriptions), and training to convergence (the COICOP model scored 0.382 at four epochs and 0.529 at convergence). A control arm adds rounds of the same size spread evenly. Both are scored once on a report set. Targeted minus control: +0.019 and +0.004 on topics, +0.000 on ISCO, +0.001 on COICOP. Report scores for control, targeted, and gpt-oss-120b: topics 0.484, 0.502, 0.511; ISCO 0.330, 0.331, 0.353; COICOP 0.561, 0.563, 0.726.</desc><defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2f5f9e"/></marker><marker id="am" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><rect width="1000" height="560" rx="12" fill="#ffffff" stroke="#e1e6ee"/><text x="24" y="34" font-size="17" font-weight="700" fill="#16315a">Targeted rounds beside a control arm</text><text x="40" y="58" font-size="12" font-weight="700" fill="#2f5f9e">TARGETED ARM</text><text x="600" y="58" font-size="12" font-weight="700" fill="#6b7280">CONTROL ARM</text><rect x="40" y="70" width="200" height="62" rx="10" fill="#e8f0fa" stroke="#2f5f9e" stroke-width="1.4"/><text x="52" y="96" font-size="13" font-weight="700" fill="#16315a">1  Gap report</text><text x="52" y="115" font-size="12.5" fill="#16315a">on the feedback set</text><rect x="290" y="70" width="200" height="62" rx="10" fill="#e8f0fa" stroke="#2f5f9e" stroke-width="1.4"/><text x="302" y="96" font-size="13" font-weight="700" fill="#16315a">2  Agent plans</text><text x="302" y="115" font-size="12.5" fill="#16315a">the round (pi)</text><rect x="290" y="190" width="200" height="62" rx="10" fill="#e8f0fa" stroke="#2f5f9e" stroke-width="1.4"/><text x="302" y="216" font-size="13" font-weight="700" fill="#16315a">3  Writer and</text><text x="302" y="235" font-size="12.5" fill="#16315a">labeller generate</text><rect x="40" y="190" width="200" height="62" rx="10" fill="#e8f0fa" stroke="#2f5f9e" stroke-width="1.4"/><text x="52" y="216" font-size="13" font-weight="700" fill="#16315a">4  Train to convergence,</text><text x="52" y="235" font-size="12.5" fill="#16315a">score the feedback set</text><line x1="242" y1="101" x2="288" y2="101" stroke="#2f5f9e" stroke-width="2" marker-end="url(#ar)"/><line x1="390" y1="134" x2="390" y2="188" stroke="#2f5f9e" stroke-width="2" marker-end="url(#ar)"/><line x1="288" y1="221" x2="242" y2="221" stroke="#2f5f9e" stroke-width="2" marker-end="url(#ar)"/><line x1="140" y1="188" x2="140" y2="134" stroke="#2f5f9e" stroke-width="2" marker-end="url(#ar)"/><rect x="600" y="70" width="370" height="62" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="612" y="96" font-size="13" font-weight="700" fill="#16315a">Balanced rounds of the same size</text><text x="612" y="115" font-size="12.5" fill="#16315a">train to convergence, score the feedback set</text><rect x="600" y="190" width="370" height="62" rx="10" fill="#ffffff" stroke="#16315a" stroke-width="1.4"/><text x="612" y="216" font-size="13" font-weight="700" fill="#16315a">Report set, scored once at the end</text><text x="612" y="235" font-size="12.5" fill="#16315a">three seeds per arm, interval over texts</text><line x1="785" y1="134" x2="785" y2="188" stroke="#6b7280" stroke-width="2" marker-end="url(#am)"/><path d="M242,240 C420,300 520,260 598,232" fill="none" stroke="#2f5f9e" stroke-width="2" marker-end="url(#ar)"/><rect x="24" y="290" width="952" height="226" rx="10" fill="#ffffff" stroke="#e1e6ee"/><g opacity="0"><animate attributeName="opacity" dur="42.0s" repeatCount="indefinite" keyTimes="0.0000;0.0095;0.1667;0.1762;1.0000" values="0;1;1;0;0"/><rect x="37" y="67" width="206" height="68" rx="12" fill="none" stroke="#16315a" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" dur="42.0s" repeatCount="indefinite" keyTimes="0.0000;0.0095;0.0190;0.1619;0.1714;1.0000" values="0;0;1;1;0;0"/><text x="44" y="322" font-size="15.5" font-weight="700" fill="#16315a">The gap report</text><text x="44" y="356" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">The latest model is scored on the feedback set, two thirds</text><text x="44" y="380" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">of the real calibration texts. The report lists the weakest</text><text x="44" y="404" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">labels, the most frequent confusions, over-assigned labels,</text><text x="44" y="428" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">labels with few examples, and the labeller&#x27;s agreement.</text><text x="560" y="330" font-size="12" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">weakest:  Indigenous Peoples; Oceans, Fisheries, ...; Debt</text><text x="560" y="350" font-size="12" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">confused (reference -&gt; assigned, abstracts):</text><text x="560" y="370" font-size="12" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">  Inequality and Shared Prosperity -&gt; Measuring Poverty, 48</text><text x="560" y="390" font-size="12" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">  Macroeconomics -&gt; Migration, 43</text><text x="560" y="410" font-size="12" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">over-assigned:  Migration, 152 assigned, 10 in reference</text></g><g opacity="0"><animate attributeName="opacity" dur="42.0s" repeatCount="indefinite" keyTimes="0.0000;0.1667;0.1762;0.3333;0.3429;1.0000" values="0;0;1;1;0;0"/><rect x="287" y="67" width="206" height="68" rx="12" fill="none" stroke="#16315a" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" dur="42.0s" repeatCount="indefinite" keyTimes="0.0000;0.1762;0.1857;0.3286;0.3381;1.0000" values="0;0;1;1;0;0"/><text x="44" y="322" font-size="15.5" font-weight="700" fill="#16315a">The agent&#x27;s plan</text><text x="44" y="356" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">The agent has seven tools of the harness and no others: no</text><text x="44" y="380" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">shell, no files. In the first topic round it put 65 of 150</text><text x="44" y="404" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">requests on weak labels and 85 on five confused pairs, with</text><text x="44" y="428" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">a note for the writer on each item.</text><text x="560" y="330" font-size="12.5" fill="#6b7280">positive items, six weak labels</text><rect x="560" y="337" width="250" height="16" rx="3" fill="#f3f4f6"/><rect x="560" y="337" width="108.3" height="16" rx="3" fill="#2f5f9e"/><text x="820" y="350" font-size="13" font-weight="700" fill="#2f5f9e">65 requests</text><text x="560" y="374" font-size="12.5" fill="#6b7280">contrast items, five confused pairs</text><rect x="560" y="381" width="250" height="16" rx="3" fill="#f3f4f6"/><rect x="560" y="381" width="141.7" height="16" rx="3" fill="#d9822b"/><text x="820" y="394" font-size="13" font-weight="700" fill="#d9822b">85 requests</text></g><g opacity="0"><animate attributeName="opacity" dur="42.0s" repeatCount="indefinite" keyTimes="0.0000;0.3333;0.3429;0.5000;0.5095;1.0000" values="0;0;1;1;0;0"/><rect x="287" y="187" width="206" height="68" rx="12" fill="none" stroke="#16315a" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" dur="42.0s" repeatCount="indefinite" keyTimes="0.0000;0.3429;0.3524;0.4952;0.5048;1.0000" values="0;0;1;1;0;0"/><text x="44" y="322" font-size="15.5" font-weight="700" fill="#16315a">Generation with a labeller</text><text x="44" y="356" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">The writer produces labelled texts for each request. The</text><text x="44" y="380" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">labeller labels them again without the writer&#x27;s labels, and</text><text x="44" y="404" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">texts on which the two disagree are dropped: 2.8 percent of</text><text x="44" y="428" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">ISCO titles and 4.5 percent of COICOP descriptions.</text><text x="560" y="330" font-size="12.5" fill="#6b7280">ISCO-08, round 0: 18,061 titles</text><rect x="560" y="337" width="250" height="16" rx="3" fill="#f3f4f6"/><rect x="560" y="337" width="243.0" height="16" rx="3" fill="#2f8f5b"/><text x="820" y="350" font-size="13" font-weight="700" fill="#2f8f5b">97.2% agree</text><text x="560" y="374" font-size="12.5" fill="#6b7280">COICOP, round 0: 10,035 descriptions</text><rect x="560" y="381" width="250" height="16" rx="3" fill="#f3f4f6"/><rect x="560" y="381" width="238.8" height="16" rx="3" fill="#2f8f5b"/><text x="820" y="394" font-size="13" font-weight="700" fill="#2f8f5b">95.5% agree</text></g><g opacity="0"><animate attributeName="opacity" dur="42.0s" repeatCount="indefinite" keyTimes="0.0000;0.5000;0.5095;0.6667;0.6762;1.0000" values="0;0;1;1;0;0"/><rect x="37" y="187" width="206" height="68" rx="12" fill="none" stroke="#16315a" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" dur="42.0s" repeatCount="indefinite" keyTimes="0.0000;0.5095;0.5190;0.6619;0.6714;1.0000" values="0;0;1;1;0;0"/><text x="44" y="322" font-size="15.5" font-weight="700" fill="#16315a">Training and the decision</text><text x="44" y="356" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">Each round trains a new model on all accepted examples, to</text><text x="44" y="380" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">convergence. At four epochs the COICOP model was under-</text><text x="44" y="404" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">trained (0.382 against 0.529 on the same data). A round is</text><text x="44" y="428" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">kept when it is no more than 0.03 below the best round.</text><text x="560" y="330" font-size="12.5" fill="#6b7280">COICOP round 0, four epochs</text><rect x="560" y="337" width="250" height="16" rx="3" fill="#f3f4f6"/><rect x="560" y="337" width="136.4" height="16" rx="3" fill="#6b7280"/><text x="820" y="350" font-size="13" font-weight="700" fill="#6b7280">0.382</text><text x="560" y="374" font-size="12.5" fill="#6b7280">COICOP round 0, to convergence</text><rect x="560" y="381" width="250" height="16" rx="3" fill="#f3f4f6"/><rect x="560" y="381" width="188.9" height="16" rx="3" fill="#2f5f9e"/><text x="820" y="394" font-size="13" font-weight="700" fill="#2f5f9e">0.529</text></g><g opacity="0"><animate attributeName="opacity" dur="42.0s" repeatCount="indefinite" keyTimes="0.0000;0.6667;0.6762;0.8333;0.8429;1.0000" values="0;0;1;1;0;0"/><rect x="597" y="67" width="376" height="68" rx="12" fill="none" stroke="#16315a" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" dur="42.0s" repeatCount="indefinite" keyTimes="0.0000;0.6762;0.6857;0.8286;0.8381;1.0000" values="0;0;1;1;0;0"/><text x="44" y="322" font-size="15.5" font-weight="700" fill="#16315a">The control arm</text><text x="44" y="356" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">A control arm adds the same number of requests in each</text><text x="44" y="380" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">round, spread evenly over the labels. Only the difference</text><text x="44" y="404" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">between the two arms shows what targeting adds: more data</text><text x="44" y="428" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">alone raised topics by 0.024 and COICOP by 0.042.</text><text x="560" y="330" font-size="12.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">same round size, balanced plan</text><text x="560" y="350" font-size="12.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">same training, same feedback set</text><text x="560" y="370" font-size="12.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">final models: three seeds each</text><text x="560" y="390" font-size="12.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">report set scored once, at the end</text></g><g opacity="0"><animate attributeName="opacity" dur="42.0s" repeatCount="indefinite" keyTimes="0.0000;0.8333;0.8429;1.0000" values="0;0;1;1"/><rect x="597" y="187" width="376" height="68" rx="12" fill="none" stroke="#16315a" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" dur="42.0s" repeatCount="indefinite" keyTimes="0.0000;0.8429;0.8524;0.9952;1.0000" values="0;0;1;1;0"/><text x="44" y="322" font-size="15.5" font-weight="700" fill="#16315a">Scores on the report sets</text><text x="44" y="356" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">Targeted rounds scored the same as the control arm in four</text><text x="44" y="380" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">comparisons: +0.019 and +0.004 on topics, +0.000 on ISCO,</text><text x="44" y="404" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">+0.001 on COICOP, with fewer examples. The large model</text><text x="44" y="428" font-size="13.5" font-family="Helvetica, Arial, sans-serif" font-weight="400" fill="#16315a" xml:space="preserve">asked directly led on COICOP by 0.16.</text><text x="560" y="350" font-size="12" fill="#6b7280">Topics, replicate 1 (micro F1)</text><rect x="560" y="356" width="151.2" height="10" rx="2" fill="#6b7280"/><text x="717.2" y="365" font-size="11" fill="#6b7280">0.484</text><rect x="560" y="369" width="156.9" height="10" rx="2" fill="#2f5f9e"/><text x="722.9" y="378" font-size="11" fill="#2f5f9e">0.502</text><rect x="560" y="382" width="159.7" height="10" rx="2" fill="#d9822b"/><text x="725.7" y="391" font-size="11" fill="#d9822b">0.511</text><text x="560" y="406" font-size="12" fill="#6b7280">ISCO-08 (accuracy)</text><rect x="560" y="412" width="103.1" height="10" rx="2" fill="#6b7280"/><text x="669.1" y="421" font-size="11" fill="#6b7280">0.330</text><rect x="560" y="425" width="103.4" height="10" rx="2" fill="#2f5f9e"/><text x="669.4" y="434" font-size="11" fill="#2f5f9e">0.331</text><rect x="560" y="438" width="110.3" height="10" rx="2" fill="#d9822b"/><text x="676.3" y="447" font-size="11" fill="#d9822b">0.353</text><text x="560" y="462" font-size="12" fill="#6b7280">COICOP (accuracy)</text><rect x="560" y="468" width="175.3" height="10" rx="2" fill="#6b7280"/><text x="741.3" y="477" font-size="11" fill="#6b7280">0.561</text><rect x="560" y="481" width="175.9" height="10" rx="2" fill="#2f5f9e"/><text x="741.9" y="490" font-size="11" fill="#2f5f9e">0.563</text><rect x="560" y="494" width="226.9" height="10" rx="2" fill="#d9822b"/><text x="792.9" y="503" font-size="11" fill="#d9822b">0.726</text><rect x="560" y="320" width="10" height="10" fill="#6b7280"/><text x="574" y="329" font-size="11.5" fill="#6b7280">control</text><rect x="670" y="320" width="10" height="10" fill="#2f5f9e"/><text x="684" y="329" font-size="11.5" fill="#6b7280">targeted</text><rect x="780" y="320" width="10" height="10" fill="#d9822b"/><text x="794" y="329" font-size="11.5" fill="#6b7280">gpt-oss-120b</text></g><text x="24" y="542" font-size="12" fill="#6b7280">Tests of chapter 8: topics (two replicates), ISCO-08 job titles, COICOP item descriptions; gpt-oss-120b as writer, labeller, and agent.</text></svg>