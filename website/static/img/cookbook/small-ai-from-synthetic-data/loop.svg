<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" style="max-width:100%;height:auto" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Feedback loop with a control arm</title><desc id="d">The feedback loop. The targeted arm is a cycle of four steps run for five rounds: 1 a gap report on the feedback set, 2 the agent plans the next round, 3 a writer and a labeller generate examples, 4 the small model is trained to convergence. The control arm runs five rounds of the same size with balanced plans. Both arms are scored once on the report set at the end, with three seeds per arm.</desc><style>@keyframes spin { 0% { transform: rotate(0deg) } 83.33% { transform: rotate(1800deg) } 100% { transform: rotate(1800deg) } }.dot { transform-box: view-box; transform-origin: 250px 245px; animation: spin 18.0s linear infinite; }@keyframes on { 0% { opacity: 0 } 3% { opacity: 1 } 15.67% { opacity: 1 } 18.67% { opacity: 0 } 100% { opacity: 0 } }.ring { opacity: 0; animation: on 18.0s linear infinite; }@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style><rect width="1000" height="470" rx="12" fill="#ffffff" stroke="#d5dbe5"/><defs><marker id="ab" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16315a"/></marker><marker id="ag" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><text x="28" y="38" font-size="18" font-weight="700" fill="#16315a" text-anchor="start">Targeted rounds beside a control arm</text><text x="250" y="80" font-size="15" font-weight="700" fill="#16315a" text-anchor="middle">Targeted arm</text><text x="760" y="80" font-size="15" font-weight="700" fill="#16315a" text-anchor="middle">Control arm</text><path d="M279.2,149.4 A100,100 0 0 1 345.6,215.8" fill="none" stroke="#d5dbe5" stroke-width="3" marker-end="url(#ab)"/><path d="M345.6,274.2 A100,100 0 0 1 279.2,340.6" fill="none" stroke="#d5dbe5" stroke-width="3" marker-end="url(#ab)"/><path d="M220.8,340.6 A100,100 0 0 1 154.4,274.2" fill="none" stroke="#d5dbe5" stroke-width="3" marker-end="url(#ab)"/><path d="M154.4,215.8 A100,100 0 0 1 220.8,149.4" fill="none" stroke="#d5dbe5" stroke-width="3" marker-end="url(#ab)"/><g class="dot"><circle cx="250" cy="145" r="29" fill="none" stroke="#16315a" stroke-width="3"/></g><circle cx="250.0" cy="145.0" r="22" fill="#6b7280"/><text x="250.0" y="151.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="288" y="133" font-size="14.5" font-weight="700" fill="#16315a" text-anchor="start">Gap report</text><text x="288" y="151" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">on the feedback set</text><circle cx="350.0" cy="245.0" r="22" fill="#c96d16"/><text x="350.0" y="251.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="384" y="241" font-size="14.5" font-weight="700" fill="#16315a" text-anchor="start">Agent plans</text><text x="384" y="259" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">the next round</text><circle cx="250.0" cy="345.0" r="22" fill="#c96d16"/><text x="250.0" y="351.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="250" y="389" font-size="14.5" font-weight="700" fill="#16315a" text-anchor="middle">Writer and labeller</text><text x="250" y="407" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">generate</text><circle cx="150.0" cy="245.0" r="22" fill="#2f5f9e"/><text x="150.0" y="251.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="116" y="241" font-size="14.5" font-weight="700" fill="#16315a" text-anchor="end">Train</text><text x="116" y="259" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="end">to convergence</text><text x="250" y="247" font-size="19" font-weight="700" fill="#16315a" text-anchor="middle">5 rounds</text><text x="250" y="267" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">planned by the agent</text><rect class="ring" style="animation-delay:0.0s" x="577" y="145" width="70" height="70" rx="12" fill="none" stroke="#16315a" stroke-width="3"/><rect x="582" y="150" width="60" height="60" rx="9" fill="#f5f7fa" stroke="#6b7280" stroke-width="1.5"/><text x="612.0" y="186.0" font-size="17" font-weight="700" fill="#6b7280" text-anchor="middle">1</text><rect class="ring" style="animation-delay:3.0s" x="651" y="145" width="70" height="70" rx="12" fill="none" stroke="#16315a" stroke-width="3"/><rect x="656" y="150" width="60" height="60" rx="9" fill="#f5f7fa" stroke="#6b7280" stroke-width="1.5"/><text x="686.0" y="186.0" font-size="17" font-weight="700" fill="#6b7280" text-anchor="middle">2</text><rect class="ring" style="animation-delay:6.0s" x="725" y="145" width="70" height="70" rx="12" fill="none" stroke="#16315a" stroke-width="3"/><rect x="730" y="150" width="60" height="60" rx="9" fill="#f5f7fa" stroke="#6b7280" stroke-width="1.5"/><text x="760.0" y="186.0" font-size="17" font-weight="700" fill="#6b7280" text-anchor="middle">3</text><rect class="ring" style="animation-delay:9.0s" x="799" y="145" width="70" height="70" rx="12" fill="none" stroke="#16315a" stroke-width="3"/><rect x="804" y="150" width="60" height="60" rx="9" fill="#f5f7fa" stroke="#6b7280" stroke-width="1.5"/><text x="834.0" y="186.0" font-size="17" font-weight="700" fill="#6b7280" text-anchor="middle">4</text><rect class="ring" style="animation-delay:12.0s" x="873" y="145" width="70" height="70" rx="12" fill="none" stroke="#16315a" stroke-width="3"/><rect x="878" y="150" width="60" height="60" rx="9" fill="#f5f7fa" stroke="#6b7280" stroke-width="1.5"/><text x="908.0" y="186.0" font-size="17" font-weight="700" fill="#6b7280" text-anchor="middle">5</text><text x="760" y="240" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">balanced plans, same number of requests</text><rect class="ring" style="animation-delay:15.0s" x="595" y="315" width="330" height="86" rx="15" fill="none" stroke="#16315a" stroke-width="3"/><rect x="600" y="320" width="320" height="76" rx="12" fill="#ffffff" stroke="#16315a" stroke-width="1.6"/><text x="760.0" y="352" font-size="16" font-weight="700" fill="#16315a" text-anchor="middle">Report set</text><text x="760.0" y="374" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">scored once, three seeds per arm</text><line x1="760" y1="252" x2="760" y2="311" stroke="#6b7280" stroke-width="2" marker-end="url(#ag)"/><path d="M333.6,344.6 C393.6,394.6 480,358.0 591,358.0" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#ag)"/><text x="480" y="384.0" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">after the last round</text><circle cx="34" cy="444" r="6" fill="#c96d16"/><text x="46" y="448" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">large model</text><circle cx="143.2" cy="444" r="6" fill="#2f5f9e"/><text x="155.2" y="448" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">small model</text><circle cx="252.39999999999998" cy="444" r="6" fill="#6b7280"/><text x="264.4" y="448" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">data and people</text></svg>