<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 345" width="1000" height="345" style="max-width:100%;height:auto" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Workflow of the guide</title><desc id="d">The seven steps of the guide on one line, with a figure of the running example under each: 1 labels, 86; 2 generation by a large model, 20,074 sentences; 3 checks, micro F1 of 0.446 for the best generated set; 4 training of the small model, two minutes on one GPU; 5 evaluation, micro F1 of 0.460 on 300 abstracts; 6 application, 0.17 seconds per abstract on CPU; 7 release, a dataset card and a model card. A dashed arrow from step 6 to step 2 shows that over-assigned labels go back to generation.</desc><style>@keyframes on { 0% { opacity: 0 } 3% { opacity: 1 } 13.29% { opacity: 1 } 16.29% { opacity: 0 } 100% { opacity: 0 } }.ring { opacity: 0; animation: on 21.0s linear infinite; }@keyframes run { from { stroke-dashoffset: 840 } to { stroke-dashoffset: 0 } }.run { stroke-dasharray: 840; stroke-dashoffset: 840; animation: run 21.0s linear infinite; }@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style><rect width="1000" height="345" rx="12" fill="#ffffff" stroke="#d5dbe5"/><defs><marker id="fb" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c96d16"/></marker></defs><text x="28" y="38" font-size="18" font-weight="700" fill="#16315a" text-anchor="start">From a label list to a small model</text><path d="M780,134 C780,73 220,73 220,132" fill="none" stroke="#c96d16" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#fb)"/><text x="500.0" y="77" font-size="13" font-weight="400" fill="#c96d16" text-anchor="middle">over-assigned labels go back to generation</text><line x1="80" y1="165" x2="920" y2="165" stroke="#d5dbe5" stroke-width="4"/><line class="run" x1="80" y1="165" x2="920" y2="165" stroke="#16315a" stroke-width="4"/><circle class="ring" style="animation-delay:0.0s" cx="80" cy="165" r="34" fill="none" stroke="#16315a" stroke-width="3"/><circle cx="80" cy="165" r="27" fill="#6b7280"/><text x="80" y="171" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="80" y="223" font-size="15.5" font-weight="700" fill="#16315a" text-anchor="middle">Labels</text><text x="80" y="253" font-size="21" font-weight="700" fill="#16315a" text-anchor="middle">86</text><text x="80" y="272" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">labels</text><circle class="ring" style="animation-delay:3.0s" cx="220" cy="165" r="34" fill="none" stroke="#16315a" stroke-width="3"/><circle cx="220" cy="165" r="27" fill="#c96d16"/><text x="220" y="171" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="220" y="223" font-size="15.5" font-weight="700" fill="#16315a" text-anchor="middle">Generate</text><text x="220" y="253" font-size="21" font-weight="700" fill="#c96d16" text-anchor="middle">20,074</text><text x="220" y="272" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">sentences</text><circle class="ring" style="animation-delay:6.0s" cx="360" cy="165" r="34" fill="none" stroke="#16315a" stroke-width="3"/><circle cx="360" cy="165" r="27" fill="#6b7280"/><text x="360" y="171" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="360" y="223" font-size="15.5" font-weight="700" fill="#16315a" text-anchor="middle">Check</text><text x="360" y="253" font-size="21" font-weight="700" fill="#16315a" text-anchor="middle">0.446</text><text x="360" y="272" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">micro F1, best set</text><circle class="ring" style="animation-delay:9.0s" cx="500" cy="165" r="34" fill="none" stroke="#16315a" stroke-width="3"/><circle cx="500" cy="165" r="27" fill="#2f5f9e"/><text x="500" y="171" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="500" y="223" font-size="15.5" font-weight="700" fill="#16315a" text-anchor="middle">Train</text><text x="500" y="253" font-size="21" font-weight="700" fill="#2f5f9e" text-anchor="middle">2 min</text><text x="500" y="272" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">on one GPU</text><circle class="ring" style="animation-delay:12.0s" cx="640" cy="165" r="34" fill="none" stroke="#16315a" stroke-width="3"/><circle cx="640" cy="165" r="27" fill="#6b7280"/><text x="640" y="171" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="640" y="223" font-size="15.5" font-weight="700" fill="#16315a" text-anchor="middle">Evaluate</text><text x="640" y="253" font-size="21" font-weight="700" fill="#16315a" text-anchor="middle">0.460</text><text x="640" y="272" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">micro F1 on 300 abstracts</text><circle class="ring" style="animation-delay:15.0s" cx="780" cy="165" r="34" fill="none" stroke="#16315a" stroke-width="3"/><circle cx="780" cy="165" r="27" fill="#2f5f9e"/><text x="780" y="171" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="780" y="223" font-size="15.5" font-weight="700" fill="#16315a" text-anchor="middle">Apply</text><text x="780" y="253" font-size="21" font-weight="700" fill="#2f5f9e" text-anchor="middle">0.17 s</text><text x="780" y="272" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">per abstract on CPU</text><circle class="ring" style="animation-delay:18.0s" cx="920" cy="165" r="34" fill="none" stroke="#16315a" stroke-width="3"/><circle cx="920" cy="165" r="27" fill="#6b7280"/><text x="920" y="171" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="920" y="223" font-size="15.5" font-weight="700" fill="#16315a" text-anchor="middle">Release</text><text x="920" y="253" font-size="21" font-weight="700" fill="#16315a" text-anchor="middle">2 cards</text><text x="920" y="272" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">dataset and model</text><circle cx="34" cy="319" r="6" fill="#c96d16"/><text x="46" y="323" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">large model</text><circle cx="143.2" cy="319" r="6" fill="#2f5f9e"/><text x="155.2" y="323" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">small model</text><circle cx="252.39999999999998" cy="319" r="6" fill="#6b7280"/><text x="264.4" y="323" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">data and people</text></svg>